<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Connection Error</title>
    <style>
        :root {
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --bg: #f9fafb;
            --text-main: #1f2937;
            --text-muted: #6b7280;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            padding: 24px;
            overflow: hidden;
        }

        .icon-container {
            width: 80px;
            height: 80px;
            background-color: #fee2e2;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
            animation: pulse 2s infinite ease-in-out;
        }

        .icon-container svg {
            width: 40px;
            height: 40px;
            color: #ef4444;
        }

        h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        p {
            font-size: 15px;
            line-height: 1.5;
            color: var(--text-muted);
            margin-bottom: 32px;
            max-width: 320px;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px 32px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.2);
            text-decoration: none;
            display: inline-block;
        }

        .btn:active {
            background-color: var(--primary-hover);
            transform: scale(0.97);
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
    </style>
</head>
<body>

    <div class="icon-container">
        <!-- Disconnected Signal Icon (SVG) -->
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M18.364 5.636a9 9 0 010 12.728m0 0l-2.829-2.829m2.829 2.829L21 21M15.536 8.464a5 5 0 010 7.072m0 0l-2.829-2.829m-4.243 2.829a4.978 4.978 0 01-1.414-2.83m-1.414 5.658a9 9 0 01-2.167-9.238m7.824 2.167a1 1 0 111.414 1.414m-1.414-1.414L3 3m8.293 8.293l1.414 1.414" />
        </svg>
    </div>

    <h1>Connection Lost</h1>
    <p>The application could not reach the server. Please check your internet connection or try again later.</p>

    <!-- Button to reload the WebView to the root URL defined in Capacitor config -->
    <a href="/" class="btn" onclick="retryConnection(event)">Try Again</a>

    <script>
        function retryConnection(e) {
            e.preventDefault();
            // Brief visual feedback delay before reload
            setTimeout(() => {
                // use a custom scheme that will be intercepted by MainActivity.java in the native layer to reload the WebView
                window.location.href = 'swaplab://retry';
            }, 150);
        }
    </script>
</body>
</html>
